name: Check Commit Format

on:
  push:
  pull_request:

jobs:
  check-commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate commit messages
        run: |
          echo "🔍 Checking commit messages..."
          errors=0
          regex='^\[(FIX|ADD|IMP|REF)\]\ [a-zA-Z0-9_]+:\ .{1,80}$'

          # Determine commits to check
          if [ "${{ github.event_name }}" = "pull_request" ]; then
              commit_range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
              # for normal push events
              if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
                  commit_range="${{ github.sha }}"
              else
                  commit_range="${{ github.event.before }}..${{ github.sha }}"
              fi
          fi

          echo "Checking commits in range: $commit_range"
          git log $commit_range --pretty=format:"%H" | while read -r commit; do
              subject=$(git log -1 --format=%s "$commit")
              if ! echo "$subject" | grep -Eq "$regex"; then
                  echo "❌ Invalid commit message: '$subject'"
                  echo "Expected: [FIX|ADD|IMP|REF] modulename: short message (<=80 chars)"
                  errors=$((errors+1))
              fi
          done

          if [ "$errors" -gt 0 ]; then
              echo "❌ Found $errors invalid commit message(s)."
              exit 1
          fi

          echo "✅ All commit messages follow the format."
